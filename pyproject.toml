[project]
name = "fmw-save-editor"
version = "0.1.0"
description = "Save editor for Fantasy Maiden Wars: Dream of the Stray Dreamer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "tyro>=0.9",
    "rich>=13",
    "attrs>=24",
]

[project.scripts]
fmw-save-editor = "fmw_save_editor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fmw_save_editor"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
